<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pippo: La Dolce Vita</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#8bd8ed,#e5f8ce);color:#49372b;text-align:center}
header{padding:18px;background:#fff8;border-radius:0 0 20px 20px}
h1{margin:5px;font-size:25px}
.stats{display:flex;justify-content:space-around;padding:12px;font-weight:bold}
.scene{margin:12px auto;padding:25px 10px;background:#fff9;border-radius:25px;width:90%;max-width:420px}
.pet{font-size:105px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
#message{min-height:24px;font-weight:bold}
.meters{padding:8px}
.meter{height:12px;background:#ddd;border-radius:10px;margin:5px}
.fill{height:100%;background:#72c77b;border-radius:10px;width:70%}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;max-width:440px;margin:auto}
button{border:0;border-radius:15px;padding:15px 8px;background:#fff;color:#49372b;font-size:16px;font-weight:bold;box-shadow:0 3px 5px #0002}
button:active{transform:scale(.96)}
footer{padding:15px}
</style>
</head>
<body>
<header>
<h1>🇮🇹 PIPPO: LA DOLCE VITA</h1>
<div>La vita è bella! ❤️</div>
</header>
<div class="stats">
<div>🪙 <span id="coins">20</span></div>
<div>⭐ Уровень <span id="level">1</span></div>
<div>✨ XP <span id="xp">0</span></div>
</div>
<div class="scene">
<div class="pet" id="pet">🐶</div>
<h2>Пиппо</h2>
<div id="message">Чао! Давай веселиться!</div>
<div class="meters">
<div>🍕 Сытость</div><div class="meter"><div class="fill" id="food"></div></div>
<div>😊 Настроение</div><div class="meter"><div class="fill" id="mood"></div></div>
<div>⚡ Энергия</div><div class="meter"><div class="fill" id="energy"></div></div>
</div>
</div>
<div class="buttons">
<button onclick="act('feed')">🍕 Покормить</button>
<button onclick="act('ball')">⚽ Футбол</button>
<button onclick="act('dance')">💃 Танцевать</button>
<button onclick="act('sleep')">🌙 Спать</button>
<button onclick="act('garden')">🌻 Сад</button>
<button onclick="act('wash')">🛁 Купать</button>
</div>
<footer>☀️ Piccolo mondo, grande felicità!</footer>
<script>
let s=JSON.parse(localStorage.getItem('pippoSave')||'null')||{coins:20,xp:0,level:1,food:70,mood:70,energy:70};
function save(){
 localStorage.setItem('pippoSave',JSON.stringify(s));
 ['coins','xp','level','food','mood','energy'].forEach(k=>{
 let el=document.getElementById(k);
 if(el)el.textContent=s[k];
 });
 ['food','mood','energy'].forEach(k=>{
 document.getElementById(k).style.width=s[k]+'%';
 });
}
function act(a){
 let msg='',cost=0,pet='🐶';
 if(a==='feed'){cost=3;s.food=Math.min(100,s.food+25);msg='Ммм! Buonissimo!';pet='😋'}
 if(a==='ball'){cost=2;s.energy=Math.max(0,s.energy-15);s.mood=Math.min(100,s.mood+20);msg='Гол! Forza Pippo!';pet='⚽'}
 if(a==='dance'){cost=2;s.energy=Math.max(0,s.energy-10);s.mood=Math.min(100,s.mood+25);msg='Mamma mia! Какой танец!';pet='💃'}
 if(a==='sleep'){s.energy=Math.min(100,s.energy+35);msg='Buona notte, Пиппо!';pet='😴'}
 if(a==='garden'){cost=2;s.mood=Math.min(100,s.mood+15);msg='Как красиво цветут цветы!';pet='🌻'}
 if(a==='wash'){s.mood=Math.min(100,s.mood+10);msg='Чистый и счастливый Пиппо!';pet='🛁'}
 if(s.coins<cost){msg='Не хватает монеток!';}
 else{
 s.coins-=cost;
 s.xp+=10;
 s.coins+=a==='garden'?5:2;
 if(s.xp>=100){s.xp-=100;s.level++;msg+=' Новый уровень!'}
 }
 document.getElementById('pet').textContent=pet;
 document.getElementById('message').textContent=msg;
 save();
}
save();
</script>
</body>
</html>
