<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6c96b"><title>Pippo: La Dolce Vita</title>
<style>
:root{--ink:#493b35;--cream:#fff6df;--coral:#ef806b;--green:#5e9b72;--gold:#f3b83f}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#9bd4df 0 35%,#c9e6a0 35% 100%);min-height:100vh}
.app{max-width:520px;margin:auto;min-height:100vh;padding:16px 16px 28px;background:linear-gradient(180deg,#b8e4e8,#f7d98e 55%,#b9d98f);overflow:hidden;position:relative}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:900;font-size:20px;letter-spacing:.4px}.coins{background:#fff8df;border:2px solid #e9bd60;border-radius:24px;padding:8px 13px;font-weight:800}
.sub{text-align:center;font-size:13px;font-weight:700;opacity:.72;margin-top:4px}
.scene{height:340px;position:relative;display:grid;place-items:center;margin:12px -8px 8px;border-radius:28px;background:linear-gradient(#9ed7df 0 62%,#87bb75 62%);box-shadow:inset 0 -10px #6fa56d,0 8px 20px #785a3320;overflow:hidden}
.sun{position:absolute;right:28px;top:25px;width:58px;height:58px;background:#ffe58b;border-radius:50%;box-shadow:0 0 0 12px #ffe58b35}
.hill{position:absolute;bottom:55px;width:120%;height:90px;background:#9acb7c;border-radius:50% 50% 0 0}.hill.back{bottom:85px;left:-35%;background:#add58c}
.house{position:absolute;bottom:90px;left:22px;font-size:65px;filter:drop-shadow(0 4px 2px #0002)}
.pippo{position:relative;z-index:2;font-size:128px;filter:drop-shadow(0 12px 5px #3454);animation:bob 2.4s ease-in-out infinite;cursor:pointer;user-select:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.status{position:absolute;z-index:3;top:14px;left:14px;background:#fff9e8d9;padding:8px 12px;border-radius:16px;font-size:12px;font-weight:800}
.speech{position:absolute;z-index:4;bottom:12px;background:#fff8e8;border:2px solid #f1d28e;border-radius:18px;padding:9px 15px;font-weight:800;font-size:13px;box-shadow:0 4px 0 #d9b66e}
.panel{background:#fff7e6;border:2px solid #efd79d;border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 5px 0 #d9bd7d}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:5px}.bar{height:10px;background:#eadfc7;border-radius:20px;overflow:hidden}.fill{height:100%;border-radius:20px;background:var(--green);transition:width .3s}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{border:0;border-radius:17px;padding:12px 5px;background:#fff;border-bottom:4px solid #e8d8b6;color:var(--ink);font-weight:800;font-size:12px;min-height:76px}.action:active{transform:translateY(3px);border-bottom-width:1px}.action span{display:block;font-size:26px;margin-bottom:4px}
.bottom{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;opacity:.8;padding:4px 3px}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;background:#493b35;color:white;padding:12px 18px;border-radius:20px;font-weight:700;transition:.25s;z-index:9;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><main class="app">
<header><div class="brand">🍋 PIPPO <span style="color:#d46c50">LA DOLCE VITA</span></div><div class="coins">🪙 <b id="coins">25</b></div></header>
<div class="sub">UN PICCOLO AMICO · ТВОЙ ИТАЛЬЯНСКИЙ ДРУГ</div>
<section class="scene"><div class="sun"></div><div class="hill back"></div><div class="hill"></div><div class="house">🏡</div><div class="status" id="mood">😊 Пиппо счастлив!</div><div class="pippo" id="pet" onclick="petPippo()">🐥</div><div class="speech" id="speech">Ciao! Поиграем?</div></section>
<section class="panel"><div class="stats">
<div class="stat"><label>🍝 Сытость <b id="foodN">80%</b></label><div class="bar"><div class="fill" id="food" style="width:80%"></div></div></div>
<div class="stat"><label>💖 Радость <b id="joyN">75%</b></label><div class="bar"><div class="fill" id="joy" style="width:75%"></div></div></div>
<div class="stat"><label>⚡ Энергия <b id="energyN">90%</b></label><div class="bar"><div class="fill" id="energy" style="width:90%"></div></div></div>
<div class="stat"><label>🌼 Чистота <b id="cleanN">85%</b></label><div class="bar"><div class="fill" id="clean" style="width:85%"></div></div></div>
</div></section>
<section class="panel"><div style="display:flex;justify-content:space-between;font-weight:900;margin-bottom:8px"><span>⭐ Уровень <b id="level">1</b></span><span><b id="xp">0</b>/100 XP</span></div><div class="bar" style="height:12px"><div class="fill" id="xpbar" style="width:0%;background:#efb63d"></div></div></section>
<section class="actions">
<button class="action" onclick="act('food')"><span>🍝</span>Покормить</button><button class="action" onclick="act('play')"><span>⚽</span>Футбол</button><button class="action" onclick="act('dance')"><span>💃</span>Танцы</button>
<button class="action" onclick="act('sleep')"><span>🌙</span>Поспать</button><button class="action" onclick="act('garden')"><span>🌻</span>Сад</button><button class="action" onclick="act('wash')"><span>🫧</span>Умыть</button>
</section><div class="bottom"><span>🇮🇹 Benvenuto in Italia!</span><span id="day">День 1</span></div>
</main><div class="toast" id="toast"></div>
<script>
const defaults={food:80,joy:75,energy:90,clean:85,coins:25,xp:0,level:1,day:1,last:Date.now()};
let s={...defaults,...JSON.parse(localStorage.getItem('pippo-save')||'{}')};
const $=id=>document.getElementById(id);let toastTimer;
function save(){s.last=Date.now();localStorage.setItem('pippo-save',JSON.stringify(s))}
function say(t){$('speech').textContent=t;$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function addXP(n){s.xp+=n;while(s.xp>=100){s.xp-=100;s.level++;s.coins+=20;say('Bravissimo! Новый уровень! ⭐')}} 
function act(a){let msg='';
if(a==='food'){s.food=Math.min(100,s.food+25);s.clean=Math.max(0,s.clean-3);s.coins=Math.max(0,s.coins-3);addXP(8);msg='Mamma mia! Очень вкусно!'}
if(a==='play'){if(s.energy<12)return say('Пиппо устал. Пусть отдохнёт!');s.joy=Math.min(100,s.joy+22);s.energy-=15;addXP(15);s.coins+=5;msg='ГОЛ! Forza Pippo! ⚽'}
if(a==='dance'){if(s.energy<15)return say('Нужна энергия для танцев!');s.joy=Math.min(100,s.joy+25);s.energy-=18;addXP(12);s.coins+=4;msg='Che bella musica! 💃'}
if(a==='sleep'){s.energy=Math.min(100,s.energy+38);s.food=Math.max(0,s.food-8);addXP(5);msg='Buonanotte, Пиппо 🌙'}
if(a==='garden'){s.clean=Math.min(100,s.clean+18);s.joy=Math.min(100,s.joy+10);addXP(10);s.coins+=3;msg='Какой чудесный сад! 🌻'}
if(a==='wash'){s.clean=Math.min(100,s.clean+35);s.joy=Math.max(0,s.joy-2);addXP(5);msg='Пиппо теперь чистенький! 🫧'}
save();render();say(msg)}
function petPippo(){s.joy=Math.min(100,s.joy+4);addXP(1);save();render();say('Пиппо любит обнимашки! ❤️')}
function render(){['food','joy','energy','clean'].forEach(k=>{$(k).style.width=s[k]+'%';$(k+'N').textContent=s[k]+'%'});['coins','xp','level','day'].forEach(k=>$(k).textContent=k==='day'?'День '+s.day:s[k]);$('xpbar').style.width=s.xp+'%';$('mood').textContent=s.food<25?'🥺 Пиппо голоден':s.energy<20?'😴 Пиппо хочет спать':s.joy<25?'😟 Пиппо грустит':'😊 Пиппо счастлив!';$('pet').textContent=s.energy<15?'😴':s.joy<25?'🥺':'🐥'}
const elapsed=Math.floor((Date.now()-(s.last||Date.now()))/86400000);if(elapsed>0){s.day+=elapsed;s.food=Math.max(0,s.food-elapsed*12);s.joy=Math.max(0,s.joy-elapsed*8);s.energy=Math.max(0,s.energy-elapsed*5);s.clean=Math.max(0,s.clean-elapsed*10)}render();save();
</script></body></html>
